id = "local.tab-name"
name = "Tab name"
version = "0.1.0"
min_herdr_version = "0.9.0"
description = "Name each tab after the foreground process of its pane"
platforms = ["linux", "macos"]

# herdr has no "foreground process changed" event. The zsh hook (hook.zsh)
# covers commands started and finished in a shell; these events cover new
# tabs and panes, splits, closes, and focus moving between panes of a tab.
[[startup]]
command = ["bash", "name.sh"]

[[events]]
on = "tab.created"
command = ["bash", "name.sh"]

[[events]]
on = "pane.created"
command = ["bash", "name.sh"]

[[events]]
on = "pane.focused"
command = ["bash", "name.sh"]

[[events]]
on = "pane.closed"
command = ["bash", "name.sh"]

[[events]]
on = "pane.exited"
command = ["bash", "name.sh"]

[[events]]
on = "pane.agent_detected"
command = ["bash", "name.sh"]

# Hand a manually renamed tab back to automatic naming.
[[actions]]
id = "reset"
title = "Tab name: name this tab automatically again"
contexts = ["global"]
command = ["bash", "name.sh", "--reset"]
